[project]
name = "studybot"
version = "0.1.0"
description = "タスク管理と授業の対策資料を Claude で自動生成する CLI"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.12",
    "pyyaml>=6",
    "icalendar>=5",
]

[project.scripts]
studybot = "studybot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["studybot"]
