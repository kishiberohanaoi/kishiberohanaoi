# 毎朝 7:00 (JST) に tasks.yaml から学習計画を生成して output/plans/ にコミットする。
# 使うにはリポジトリの Settings → Secrets and variables → Actions に ANTHROPIC_API_KEY を登録する。
name: daily-plan

on:
  schedule:
    - cron: "0 22 * * *"  # UTC 22:00 = JST 7:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - name: Skip if API key is not set
        id: check
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY が未設定なのでスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
      - name: Generate plan
        if: steps.check.outputs.skip != 'true'
        run: |
          pip install .
          studybot plan
      - name: Commit
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/plans
          git diff --cached --quiet || git commit -m "Add daily plan $(date +%F)"
          git push
